name: Maintain llm.txt

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/generate_llm_txt.py"
      - ".github/workflows/maintain-llm-txt.yml"
  pull_request:
    paths:
      - "scripts/generate_llm_txt.py"
      - ".github/workflows/maintain-llm-txt.yml"

permissions:
  contents: write

jobs:
  maintain-llm-txt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate llm.txt and llms.txt
        run: python scripts/generate_llm_txt.py

      - name: Verify deterministic output
        run: |
          python -m py_compile scripts/generate_llm_txt.py
          python scripts/generate_llm_txt.py --check

      - name: Commit updated files
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- llm.txt llms.txt; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm.txt llms.txt
          git commit -m "chore: refresh llm.txt"
          git push
